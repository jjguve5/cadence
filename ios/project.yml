name: Cadence
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: "4.5.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Cadence:
    type: application
    platform: iOS
    sources: [Cadence]
    dependencies:
      - package: Lottie
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cadence
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: com.jjguve5.cadence
            CFBundleURLSchemes: [cadence]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.jjguve5.cadence.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjguve5.cadence
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Cadence:
    build:
      targets:
        Cadence: all
