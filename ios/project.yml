name: Cadence
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: "4.5.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Cadence:
    type: application
    platform: iOS
    sources: [Cadence, Shared]
    dependencies:
      - package: Lottie
      - target: CadenceWidgets
        embed: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cadence
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: com.jjguve5.cadence
            CFBundleURLSchemes: [cadence]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.jjguve5.cadence.refresh]
        NSSupportsLiveActivities: true
        LSApplicationQueriesSchemes: [fitbit]
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, Geist-Bold.ttf, GeistMono-Regular.ttf, GeistMono-Medium.ttf, InstrumentSerif-Regular.ttf, InstrumentSerif-Italic.ttf]
        NSCameraUsageDescription: Scan food barcodes and receipt QR codes to log them.
        NSLocationWhenInUseUsageDescription: Live travel time for leave-by alerts and the weather where you are.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjguve5.cadence
        MARKETING_VERSION: "0.8"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CADENCE_APP
  CadenceWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjguve5.cadence.widgets
        MARKETING_VERSION: "0.8"
        CURRENT_PROJECT_VERSION: "8"
        TARGETED_DEVICE_FAMILY: "1"
  CadenceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CadenceTests]
    dependencies:
      - target: Cadence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjguve5.cadence.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cadence:
    build:
      targets:
        Cadence: all
        CadenceTests: [test]
    test:
      targets: [CadenceTests]
