name: Rollback test (simulator)
# Phase 1 install and rollback on a simulator, with synthetic data only: the 2 Nov build (dc04c07, the one on the
# phone), then the new build over it, then the old build over that, then the new one again. Every install is over
# the top: nothing is deleted or installed from scratch. Checks the data container, every record and the copies.
on:
  push:
    branches: [fase1-protecao-local]
    paths: ["ios/**", ".github/workflows/rollback.yml"]
concurrency:
  group: rollback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rollback:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      OLD_COMMIT: dc04c07
      BUNDLE: com.jjguve5.cadence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick Xcode and a simulator
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          xcrun simctl list devices available -j > devices.json
          SIM=$(SDK="$SDK" python3 - <<'EOF'
          import json, os
          sdk = tuple(int(x) for x in os.environ["SDK"].split("."))
          found = []
          for runtime, devices in json.load(open("devices.json"))["devices"].items():
              if "iOS-" not in runtime: continue
              ver = tuple(int(x) for x in runtime.split("iOS-")[1].split("-"))
              if ver > sdk or ver < (17, 0): continue
              found += [(ver, d["udid"]) for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]
          print(max(found)[1])
          EOF
          )
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          brew install xcodegen

      - name: Build the 2 Nov build and the new build
        run: |
          git worktree add ../old "$OLD_COMMIT"
          build() {
            (cd "$1" && xcodegen generate > /dev/null && xcodebuild build -project Cadence.xcodeproj -scheme Cadence \
              -destination "id=$SIM" -derivedDataPath "$GITHUB_WORKSPACE/DD-$2" CODE_SIGNING_ALLOWED=NO > "$GITHUB_WORKSPACE/build-$2.log" 2>&1) \
              || { grep -B2 -A8 "error:" "$GITHUB_WORKSPACE/build-$2.log" | head -80; exit 1; }
          }
          build ../old/ios old
          build ios new
          for v in old new; do
            APP="DD-$v/Build/Products/Debug-iphonesimulator/Cadence.app"
            echo "$v: $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist") $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist"))"
          done

      - name: Install over the top, four times, with synthetic data
        run: |
          set -e
          mkdir -p r
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl privacy "$SIM" grant notifications "$BUNDLE" 2>/dev/null || true
          run() { # install $1 over whatever is there, run it for a while, keep what it left
            xcrun simctl install "$SIM" "DD-$1/Build/Products/Debug-iphonesimulator/Cadence.app"
            C=$(xcrun simctl get_app_container "$SIM" "$BUNDLE" data)
            echo "$C" >> r/containers.txt
            if [ "$2" = "seed" ]; then mkdir -p "$C/Documents"; python3 ios/ci/rollback_fixture.py > "$C/Documents/cadence.json"; cp "$C/Documents/cadence.json" r/0-fixture.json; fi
            xcrun simctl launch "$SIM" "$BUNDLE"
            sleep 20
            xcrun simctl terminate "$SIM" "$BUNDLE" || true
            sleep 3
            cp "$C/Documents/cadence.json" "r/$3.json"
            if [ -d "$C/Documents/cadence-copies" ]; then rm -rf "r/copies-after-$4"; cp -R "$C/Documents/cadence-copies" "r/copies-after-$4"; fi
            ls -la "$C/Documents" > "r/$3-files.txt"
          }
          run old seed 1-old old
          run new - 2-new new
          run old - 3-old-again old-again
          run new - 4-new-again new-again
          xcrun simctl spawn "$SIM" log show --last 10m --style compact --predicate 'process == "Cadence"' > r/simulator.log 2>&1 || true

      - name: Check every record, the container and the copies
        run: python3 ios/ci/rollback_check.py r

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-evidence
          path: |
            r
            build-*.log
