name: Build iPhone app (unsigned IPA)
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      # The pure calculations are tested on a simulator before the device build
      - run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[0-9]( Pro)?' | head -1)
          xcodebuild test -project Cadence.xcodeproj -scheme Cadence -destination "platform=iOS Simulator,name=$SIM"             -derivedDataPath buildtest -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO             | tee test.log | grep -E "Test Case .*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)|Executed" ; exit ${PIPESTATUS[0]}
        shell: bash
      - run: >
          xcodebuild -project Cadence.xcodeproj -scheme Cadence
          -configuration Release -sdk iphoneos -destination generic/platform=iOS
          -derivedDataPath build -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" ; exit ${PIPESTATUS[0]}
        shell: bash
      - if: failure()
        run: grep -B2 -A6 "error:" build.log | head -200
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Cadence.app Payload/
          zip -qr Cadence.ipa Payload
      # The same app signed ad hoc with the App Group entitlement, to test whether widgets survive free signing
      - run: |
          rm -rf WPayload && mkdir WPayload
          cp -R build/Build/Products/Release-iphoneos/Cadence.app WPayload/
          codesign -f -s - --entitlements Widgets/Widgets.entitlements WPayload/Cadence.app/PlugIns/CadenceWidgets.appex
          codesign -f -s - --entitlements Cadence/Cadence.entitlements WPayload/Cadence.app
          mv WPayload Payload.w && mkdir wtmp && mv Payload.w wtmp/Payload && (cd wtmp && zip -qr ../Cadence-widgets-test.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-ipa
          path: |
            ios/Cadence.ipa
            ios/Cadence-widgets-test.ipa
